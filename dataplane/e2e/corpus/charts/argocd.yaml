# helm template argocd argo/argo-cd -n argocd --set server.ingress.enabled=true --set server.ingress.hostname=argocd.parity.test --set server.ingress.annotations: backend-protocol HTTPS, force-ssl-redirect --set server.ingressGrpc.enabled=true (the Ingresses only)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: v3.5.6
    helm.sh/chart: argo-cd-10.11.6
  name: argocd-server-grpc
  namespace: argocd
spec:
  ingressClassName: nginx
  rules:
  - host: grpc.argocd.parity.test
    http:
      paths:
      - backend:
          service:
            name: argocd-server
            port:
              number: 443
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: v3.5.6
    helm.sh/chart: argo-cd-10.11.6
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: nginx
  rules:
  - host: argocd.parity.test
    http:
      paths:
      - backend:
          service:
            name: argocd-server
            port:
              number: 443
        path: /
        pathType: Prefix

