# helm template oauth2-proxy oauth2-proxy/oauth2-proxy -n auth --set ingress.enabled=true --set ingress.hosts[0]=auth.parity.test --set ingress.path=/oauth2 (the Ingresses only)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: oauth2-proxy
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/instance: oauth2-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: oauth2-proxy
    app.kubernetes.io/version: 7.15.5
    helm.sh/chart: oauth2-proxy-10.7.1
  name: oauth2-proxy
  namespace: auth
spec:
  ingressClassName: nginx
  rules:
  - host: auth.parity.test
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 80
        path: /oauth2
        pathType: Prefix

