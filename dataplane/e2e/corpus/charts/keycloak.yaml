# helm template keycloak codecentric/keycloakx -n keycloak --set ingress.enabled=true --set ingress.rules[0].host=keycloak.parity.test, path /auth, proxy-buffer-size 128k (the Ingresses only)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
  labels:
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloakx
    app.kubernetes.io/version: 26.8.1
    helm.sh/chart: keycloakx-7.4.0
  name: keycloak-keycloakx
  namespace: keycloak
spec:
  ingressClassName: nginx
  rules:
  - host: keycloak.parity.test
    http:
      paths:
      - backend:
          service:
            name: keycloak-keycloakx-http
            port:
              name: http
        path: /auth
        pathType: Prefix

