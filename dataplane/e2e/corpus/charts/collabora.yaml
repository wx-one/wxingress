# helm template collabora collabora/collabora-online -n collabora --set ingress.enabled=true --set ingress.hosts[0].host=collabora.parity.test --set ingress.className=nginx (the Ingresses only)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/instance: collabora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: collabora-online
    app.kubernetes.io/version: 26.04.5.2.1
    helm.sh/chart: collabora-online-1.3.7
  name: collabora-collabora-online
spec:
  ingressClassName: nginx
  rules:
  - host: collabora.parity.test
    http:
      paths:
      - backend:
          service:
            name: collabora-collabora-online
            port:
              number: 9980
        path: /
        pathType: ImplementationSpecific

