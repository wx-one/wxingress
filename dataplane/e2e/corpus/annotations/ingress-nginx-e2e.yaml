spec:
  ingressClassName: nginx
  rules:
  - host: permanent.annotations.parity.test
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}]}
---
apiVersion: networking.k8s.io/v1
