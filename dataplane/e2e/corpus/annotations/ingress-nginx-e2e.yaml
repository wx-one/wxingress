---
# cert-manager's http01 solver, as it makes them: class nginx and none
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cm-acme-http-solver-parity
  namespace: inx-annotations
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: 0.0.0.0/0,::/0
  labels:
    acme.cert-manager.io/http01-solver: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: tls.annotations.parity.test
    http:
      paths:
      - {path: /.well-known/acme-challenge/parity-token-1, pathType: ImplementationSpecific, backend: {service: {name: cm-acme-http-solver-x7k2p, port: {number: 8089}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cm-acme-http-solver-classless
  namespace: inx-annotations
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: 0.0.0.0/0,::/0
spec:
  rules:
  - host: classless.annotations.parity.test
    http:
      paths:
      - {path: /.well-known/acme-challenge/parity-token-2, pathType: ImplementationSpecific, backend: {service: {name: cm-acme-http-solver-x7k2p, port: {number: 8089}}}}
---
