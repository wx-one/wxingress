# The annotations of ingress-nginx's own e2e suite (test/e2e/annotations/*.go
# of kubernetes/ingress-nginx), one Ingress each with the values its specs
# use, for dataplane/e2e/ingress-nginx-parity.sh. The Services are made by
# parity/corpus.py; `parity/backend` says which backend suits an Ingress.
# Left out: snippets (off by default since 1.9 and refused by ingress-nginx's
# webhook), modsecurity (fail-closed here: docs/user-guide/ingress-nginx-compatibility.md), auth-tls
# (needs a client certificate the probes do not send), ssl-passthrough
# (--enable-ssl-passthrough is off in RKE2), global-rate-limit (memcached).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite
  namespace: inx-annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: rewrite.annotations.parity.test
    http:
      paths:
      - {path: "/something(/|$)(.*)", pathType: ImplementationSpecific, backend: {service: {name: echo, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regex
  namespace: inx-annotations
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: regex.annotations.parity.test
    http:
      paths:
      - {path: "/foo/bar/[A-Z0-9]{3}", pathType: ImplementationSpecific, backend: {service: {name: echo, port: {number: 80}}}}
      - {path: /foo, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: approot
  namespace: inx-annotations
  annotations:
    nginx.ingress.kubernetes.io/app-root: /foo
spec:
  ingressClassName: nginx
  rules:
  - host: approot.annotations.parity.test
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}]}
---
apiVersion: networking.k8s.io/v1
