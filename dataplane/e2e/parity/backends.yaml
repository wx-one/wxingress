# The backends of dataplane/e2e/ingress-nginx-parity.sh, and the pod its probes run in. Images by digest.
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo, namespace: parity-backends}
spec:
  replicas: 2
  selector: {matchLabels: {app: echo}}
  template:
    metadata: {labels: {app: echo}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: echo
        # answers with what it got as JSON - method, path, query, headers, the SNI over TLS
        image: mendhak/http-https-echo:37@sha256:f55000d9196bd3c853d384af7315f509d21ffb85de315c26e9874033b9f83e15
        env: [{name: HTTP_PORT, value: "8080"}, {name: HTTPS_PORT, value: "8443"}, {name: ECHO_BACK_TO_CLIENT, value: "true"}]
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 2}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ws, namespace: parity-backends}
spec:
  replicas: 1
  selector: {matchLabels: {app: ws}}
  template:
    metadata: {labels: {app: ws}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: ws
        image: jmalloc/echo-server:v0.3.7@sha256:c87f80de8dbb976a59b228fc9ecf257e0574c6f760c2f1c5f05f64c7ac7fbc1e
        env: [{name: PORT, value: "8080"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grpcbin, namespace: parity-backends}
spec:
  replicas: 1
  selector: {matchLabels: {app: grpcbin}}
  template:
    metadata: {labels: {app: grpcbin}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: grpcbin
        image: moul/grpcbin@sha256:bd8f2ffdd02d0849fad2d1c754eff4402c867e7a3e0552b8992f4590f5687d20
---
apiVersion: v1
kind: ConfigMap
metadata: {name: authconf, namespace: parity-backends}
data:
  default.conf: |
    server {
      listen 8080;
      location /auth {
        if ($http_authorization = "Bearer good") { add_header X-Auth-Request-User parity; return 200; }
        return 401;
      }
      location / { return 200 "auth service\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth, namespace: parity-backends}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth}}
  template:
    metadata: {labels: {app: auth}}
    spec:
      terminationGracePeriodSeconds: 2
      volumes: [{name: conf, configMap: {name: authconf}}]
      containers:
      - name: nginx
        image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
---
apiVersion: v1
kind: Pod
metadata: {name: probe, namespace: parity-backends}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: probe
    image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    command: [sh, -c, "mkdir -p /p && sleep 86400"]
