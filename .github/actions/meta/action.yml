# meta, as the metalanguage repository publishes it: the image wxone/meta,
# with the binary and its headers at /opt/meta, where it was built and where
# its baked-in paths point. Copied out to the same place, with META_ROOT and
# META set for dataplane/build.sh - and META_IMAGE and META_DIGEST, which meta
# it was (the SBOM names it).
name: meta
description: meta from wxone/meta, at /opt/meta
inputs:
  image:
    description: the image, by tag and digest (ci/meta-image)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -eu
        docker pull -q "$IMAGE"
        container=$(docker create "$IMAGE")
        sudo docker cp "$container:/opt/meta" /opt/meta
        docker rm "$container" >/dev/null
        sudo chown -R "$(id -u):$(id -g)" /opt/meta
        test -x /opt/meta/meta
        {
          echo "META_ROOT=/opt/meta"
          echo "META=/opt/meta/meta"
          echo "META_IMAGE=$IMAGE"
          echo "META_DIGEST=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE" | sed 's/.*@//')"
        } >>"$GITHUB_ENV"
