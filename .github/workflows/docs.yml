# Builds the documentation site (MkDocs Material, mkdocs.yml at the
# repository root) and publishes it to GitHub Pages at
# https://wx-one.github.io/wxingress/.
#
# Pages must be set to "GitHub Actions" as its source in the repository
# settings. Pull requests only build the site, with --strict, so a broken
# link or nav entry fails before it reaches main.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # the git-revision-date plugins, should mkdocs.yml use one, need history
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # exact versions with their hashes (docs/requirements.in -> pip-compile
      # --generate-hashes); Dependabot (pip) proposes updates
      - name: Install MkDocs
        run: pip install --require-hashes --no-deps -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5