# Builds the documentation site (MkDocs Material, mkdocs.yml at the
# repository root) and publishes it to GitHub Pages at
# https://wx-one.github.io/wxingress/.
#
# Pages must be set to "GitHub Actions" as its source in the repository
# settings. Pull requests only build the site, with --strict, so a broken
# link or nav entry fails before it reaches main.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the git-revision-date plugins, should mkdocs.yml use one, need history
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # exact versions with their hashes (docs/requirements.in -> pip-compile
      # --generate-hashes); Dependabot (pip) proposes updates
      - name: Install MkDocs
        run: pip install --require-hashes --no-deps -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1