# Checks and builds wxingress on every push to main and every pull request:
#
#   go-test          gofmt check, test certificates (make secrets) and
#                    make test, with helm for the chart snapshot tests
#   go-build         the controller binary nginx-ingress (CGO_ENABLED=0)
#   dataplane-build  the data plane module and an nginx beside it, built with
#                    dataplane/build.sh and the metalang compiler
#   dataplane-test   dataplane/tests/upstream-api.sh against that nginx
#   helm             helm lint and helm package for charts/wxingress
#
# Nothing is pushed or deployed here. release.yml calls this workflow for a
# tag and builds the image from the binary and module it uploads.
#
# metalang is not open source yet (planned for Q2-Q3 2027, see NOTICE). Its
# repository publishes the compiler, binary and headers, as the image
# wxone/meta, and this only uses it: copied out to /opt/meta - see
# .github/actions/meta. Which one, by tag and digest, is in ci/meta-image: the
# metalang commit this is built and tested with, not latest.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      meta_image:
        description: metalang compiler image to build the data plane with
        required: false
        type: string
  # release.yml: always with ci/meta-image, no override (see dataplane-build)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the version the chart snapshot tests were recorded with
  HELM_VERSION: v4.3.0
  # The metalang compiler is pinned by tag and digest in ci/meta-image: the data
  # plane is built and tested with a known compiler, not latest. The
  # repository variable META_IMAGE or the workflow_dispatch input try another,
  # by digest, in runs of this workflow only - never when release.yml calls it.
  # must match NGINX_VERSION in dataplane/build.sh
  NGINX_OSS_VERSION: 1.31.10

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # the test certificates the tests embed with go:embed
      - name: Test secrets
        run: make secrets

      - name: Test
        run: make test

  go-build:
    name: Controller binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # the binary the release ships: no restored build cache
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: |
          IC_VERSION=$(git describe --tags --always --dirty)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${IC_VERSION}" \
            -o nginx-ingress ./cmd/nginx-ingress
          ./nginx-ingress -version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nginx-ingress
          path: nginx-ingress
          retention-days: 7

  dataplane-build:
    name: Data plane build
    # metalang lowers against the headers of the compiler its image was built
    # with: ubuntu:24.04, so the runner is ubuntu-24.04 and uses its gcc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # metalang by tag and digest, in one place: ci/meta-image. An override
      # (the workflow_dispatch input, else the repository variable) only in a
      # run of ci.yml itself: called from release.yml, github.workflow_ref is
      # release.yml's, and a release is built with ci/meta-image. An override
      # must name the image by digest.
      - id: pin
        env:
          OVERRIDE: ${{ inputs.meta_image || vars.META_IMAGE }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          image=$(cat ci/meta-image)
          case "$WORKFLOW_REF" in
            */.github/workflows/ci.yml@*)
              if [ -n "$OVERRIDE" ]; then
                if ! [[ "$OVERRIDE" =~ ^[a-z0-9./_-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::META_IMAGE must be <repository>[:<tag>]@sha256:<digest>"
                  exit 1
                fi
                image=$OVERRIDE
                echo "::notice::metalang image overridden: $image"
              fi ;;
          esac
          if ! [[ "$image" =~ ^[a-z0-9./_-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ci/meta-image must be <repository>[:<tag>]@sha256:<digest>"
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/meta
        with:
          image: ${{ steps.pin.outputs.image }}

      # what nginx and the module's static libcurl need to build, and the
      # headers metalang lowers the module against (curl/curl.h for meta_fetch)
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential curl ca-certificates make libpcre2-dev zlib1g-dev libssl-dev \
            libcurl4-openssl-dev >/dev/null

      - name: Build
        run: |
          "$META" --version
          ./dataplane/build.sh
          # meta's analyses: errors fail the lowering above; notes are
          # annotated so they show on the run's summary page
          grep -E '^[^ ]+:[0-9]+: note: ' dataplane/build/lower.log |
            sed -E 's#^.*/dataplane/build/main.c:([0-9]+): note: (.*)$#::warning title=meta (lowered main.c line \1)::\2#' || true
          echo "${META_IMAGE%@*}@$META_DIGEST" > dataplane/build/META-IMAGE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dataplane
          path: |
            dataplane/build/ngx_http_wxingress_module.so
            dataplane/build/nginx/sbin/nginx
            dataplane/build/META-IMAGE
            dataplane/build/*.log
          if-no-files-found: ignore
          retention-days: 7

  dataplane-test:
    name: Data plane test
    needs: dataplane-build
    runs-on: ubuntu-24.04
    # the same Debian release the image runs on, so the nginx built in the
    # metalang image finds its libraries
    container:
      image: golang:1.27.3-trixie@sha256:af1bfc2614ebb1dbd31af514b78740fd678850e76498762b425ecee4c5c6ea80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dataplane
          path: dataplane/build

      - name: Upstream API test
        run: |
          chmod +x dataplane/build/nginx/sbin/nginx
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          NGINX="$GITHUB_WORKSPACE/dataplane/build/nginx/sbin/nginx" \
          MODULE="$GITHUB_WORKSPACE/dataplane/build/ngx_http_wxingress_module.so" \
            ./dataplane/tests/upstream-api.sh

      - name: Certificates test
        run: |
          NGINX="$GITHUB_WORKSPACE/dataplane/build/nginx/sbin/nginx" \
          MODULE="$GITHUB_WORKSPACE/dataplane/build/ngx_http_wxingress_module.so" \
            ./dataplane/tests/certificates.sh

      - name: JWT test
        run: |
          NGINX="$GITHUB_WORKSPACE/dataplane/build/nginx/sbin/nginx" \
          MODULE="$GITHUB_WORKSPACE/dataplane/build/ngx_http_wxingress_module.so" \
            ./dataplane/tests/jwt.sh

      - name: OIDC test
        run: |
          NGINX="$GITHUB_WORKSPACE/dataplane/build/nginx/sbin/nginx" \
          MODULE="$GITHUB_WORKSPACE/dataplane/build/ngx_http_wxingress_module.so" \
            ./dataplane/tests/oidc.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint
        run: helm lint charts/wxingress

      - name: Package
        run: helm package charts/wxingress -d chart

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart
          path: chart/*.tgz
          retention-days: 7
