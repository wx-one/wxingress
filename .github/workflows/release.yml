# Releases wxingress for a tag v<version> (for example v5.7.1-wx5):
#
#   validate the tag (v<major>.<minor>.<patch>[-wx<n>]) and that its commit is
#            on main - before anything uses it
#   ci       the whole of ci.yml - tests, controller binary, data plane
#            module and its test, helm lint - which uploads the binary and
#            the module as artifacts of this run; always with the metalang
#            compiler of ci/meta-image
#   image    ghcr.io/wx-one/wxingress:<version>, and :latest when it is the
#            highest version tagged, built from build/Dockerfile.wxingress
#            with that binary and module; the release tarball (binary,
#            module, licences) with its SHA-256, and CycloneDX 1.6 SBOMs of
#            the release and of the image (ci/sbom.sh). The image is signed
#            with cosign (keyless, the workflow's OIDC identity) and carries a
#            build provenance and an SBOM attestation in the registry
#   chart    charts/wxingress with appVersion <version> and the image by the
#            digest just pushed, pushed to oci://ghcr.io/wx-one/charts/wxingress
#   release  a GitHub release for the tag with all of that attached and the
#            image named by its digest
#
# image, chart and release run in the GitHub Environment "release": its
# protection rules (required reviewers, the tags it may deploy) gate every
# push. The image and the chart are pushed to GHCR with GITHUB_TOKEN; no
# secrets are needed.
#
# The image is linux/amd64 only: the controller binary is built for amd64 and
# the metalang compiler image, which builds the data plane module, is amd64 only.
#
# Actions are pinned by commit; Dependabot (github-actions) proposes updates.

name: Release

on:
  push:
    tags: ['v*']
  # a dry run: everything is built, the SBOMs written and uploaded as
  # artifacts of the run, nothing is pushed, signed or released
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wx-one/wxingress
  CHART_REPOSITORY: oci://ghcr.io/wx-one/charts
  # must match NGINX_VERSION in dataplane/build.sh
  NGINX_OSS_VERSION: 1.31.10
  HELM_VERSION: v4.3.0

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      push: ${{ steps.version.outputs.push }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ]; then
            # workflow_dispatch: a dry run, nothing is pushed
            echo "version=0.0.0-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
            echo "push=false" >>"$GITHUB_OUTPUT"
            echo "latest=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-wx[0-9]+)?$ ]]; then
            echo "::error::tag $REF_NAME is not v<major>.<minor>.<patch>[-wx<n>]"
            exit 1
          fi
          # the tagged commit must be on main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
          version=${REF_NAME#v}
          # :latest only for the highest version tagged, not for a patch of
          # an older line
          highest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-wx[0-9]+)?$' | sort -V | tail -1)
          latest=false
          [ "$highest" = "$REF_NAME" ] && latest=true
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "push=true" >>"$GITHUB_OUTPUT"
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "version $version, latest: $latest"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    environment: ${{ needs.validate.outputs.push == 'true' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PUSH: ${{ needs.validate.outputs.push }}
      LATEST: ${{ needs.validate.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # for ci/sbom.sh (go version -m); no cache, nothing is built here
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Version
        run: echo "RELEASE=wxingress-$VERSION-linux-amd64" >>"$GITHUB_ENV"

      # build/Dockerfile.wxingress expects both in the build context:
      #   nginx-ingress                                  the controller binary
      #   dataplane/build/ngx_http_wxingress_module.so   the data plane module
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nginx-ingress
          path: .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dataplane
          path: dataplane/build

      - name: Check the artifacts
        run: |
          chmod +x nginx-ingress
          ./nginx-ingress -version
          test -f dataplane/build/ngx_http_wxingress_module.so
          cat dataplane/build/META-IMAGE

      - name: The release tarball and its SBOM
        run: |
          mkdir -p out "stage/$RELEASE"
          cp nginx-ingress dataplane/build/ngx_http_wxingress_module.so LICENSE NOTICE "stage/$RELEASE/"
          cp -r LICENSES "stage/$RELEASE/"
          tar -czf "out/$RELEASE.tar.gz" -C stage "$RELEASE"
          (cd out && sha256sum "$RELEASE.tar.gz" > "$RELEASE.sha256")
          ci/sbom.sh release "$VERSION" nginx-ingress dataplane/build/ngx_http_wxingress_module.so \
            > "out/$RELEASE.cdx.json"

      - name: Build the image
        run: |
          docker build -q -f build/Dockerfile.wxingress \
            --build-arg IC_VERSION="$VERSION" \
            --build-arg NGINX_OSS_VERSION="$NGINX_OSS_VERSION" \
            -t wxingress:ci .
          docker run --rm wxingress:ci -version

      - name: The image's SBOM
        run: ci/sbom.sh image "out/$RELEASE.cdx.json" "$IMAGE:$VERSION" wxingress:ci > "out/$RELEASE.image.cdx.json"

      - name: Push the image
        id: push
        if: env.PUSH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          docker login ghcr.io -u "$ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          tags=("$VERSION")
          [ "$LATEST" = true ] && tags+=(latest)
          for tag in "${tags[@]}"; do
            docker tag wxingress:ci "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          digest=${ref#*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $IMAGE:$VERSION"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" > "out/$RELEASE.image-digest"
          cat "out/$RELEASE.image-digest"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: out/${{ env.RELEASE }}.image.cdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: env.PUSH == 'true'

      # keyless: the certificate names this workflow and the tag;
      # cosign verify --certificate-identity-regexp '^https://github.com/wx-one/wxingress/.github/workflows/release.yml@refs/tags/v' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/wx-one/wxingress@<digest>
      - name: Sign the image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/*

  chart:
    name: Helm chart
    needs: [validate, image]
    runs-on: ubuntu-24.04
    environment: ${{ needs.validate.outputs.push == 'true' && 'release' || '' }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PUSH: ${{ needs.validate.outputs.push }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      # The chart keeps its own version from Chart.yaml; appVersion, the image
      # tag, becomes the release's, and the image is pinned by the digest just
      # pushed (controller.image.digest, which wins over the tag). VERSION was
      # validated against the tag pattern, DIGEST is checked here.
      - name: Package
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-wx[0-9]+)?$|^0\.0\.0-[0-9a-f]{12}$ ]]
          image="ghcr.io/wx-one/wxingress:$VERSION"
          if [ "$PUSH" = true ]; then
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="$image@$DIGEST"
            python3 - charts/wxingress/values.yaml <<'EOF'
          import os, re, sys
          p = sys.argv[1]
          s = open(p).read()
          # the controller's image: the only placeholder indented by four
          s, n = re.subn(r'(?m)^    # digest: "sha256:CHANGEME"$', '    digest: "%s"' % os.environ["DIGEST"], s)
          assert n == 1, "controller.image.digest placeholder not found"
          open(p, "w").write(s)
          EOF
          fi
          # the image Artifact Hub lists is the release's
          IMAGE_REF=$image python3 - charts/wxingress/Chart.yaml <<'EOF'
          import os, re, sys
          p = sys.argv[1]
          s = open(p).read()
          s, n = re.subn(r"(?m)^(\s+image: )ghcr\.io/wx-one/wxingress:\S+$", lambda m: m.group(1) + os.environ["IMAGE_REF"], s)
          assert n == 1, "artifacthub.io/images entry not found"
          open(p, "w").write(s)
          EOF
          helm lint charts/wxingress
          helm package charts/wxingress -d chart --app-version "$VERSION"
          helm template x chart/*.tgz > rendered.yaml
          grep -m1 'image: ghcr.io/wx-one/wxingress' rendered.yaml
          ls -l chart

      - name: Push
        if: env.PUSH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          helm registry login ghcr.io -u "$ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          for chart in chart/*.tgz; do
            helm push "$chart" "$CHART_REPOSITORY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-release
          path: chart/*.tgz

  release:
    name: GitHub release
    if: needs.validate.outputs.push == 'true'
    needs: [validate, image, chart]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-release
          path: out

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          set -euo pipefail
          image=$(cat out/*.image-digest)
          also="\`:$VERSION\`"
          [ "$LATEST" = true ] && also="$also and \`:latest\`"
          {
            echo "## Image"
            echo "\`$image\` (also $also), on the hardened Debian 13 runtime seed of container.gov.de with NGINX from nginx.org's packages: no shell, no package manager. What it adds to the seed: \`.image.cdx.json\` (CycloneDX 1.6)."
            echo
            echo "Signed with cosign (keyless) and with build provenance and SBOM attestations in the registry:"
            echo
            echo "\`\`\`"
            echo "cosign verify --certificate-identity-regexp '^https://github.com/wx-one/wxingress/.github/workflows/release.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com $image"
            echo "gh attestation verify oci://$image --repo wx-one/wxingress"
            echo "\`\`\`"
            echo
            echo "## Helm chart"
            echo "\`helm install wxingress oci://ghcr.io/wx-one/charts/wxingress\` (it deploys the image by digest), also attached as \`.tgz\`."
            echo
            echo "## Binaries"
            echo "\`wxingress-*-linux-amd64.tar.gz\`: the controller \`nginx-ingress\` and the data plane module \`ngx_http_wxingress_module.so\` (for exactly the NGINX of the image), with the licences. SHA-256 in the \`.sha256\` file, SBOM (CycloneDX 1.6) in \`.cdx.json\`."
          } > notes.md
          rm out/*.image-digest
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
