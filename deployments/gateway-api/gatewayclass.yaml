# The GatewayClass a controller started with -enable-gateway-api serves by
# default (-gateway-class=wxingress,
# -gateway-controller-name=wxingress.wizardtales.com/gateway-controller).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: wxingress
spec:
  controllerName: wxingress.wizardtales.com/gateway-controller
