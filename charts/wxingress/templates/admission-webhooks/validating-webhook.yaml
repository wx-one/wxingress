{{- if (dig "admissionWebhooks" "enabled" false .Values.controller) -}}
{{- $aw := .Values.controller.admissionWebhooks -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  {{- if or $aw.certManager.enabled $aw.annotations }}
  annotations:
  {{- if $aw.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace (include "nginx-ingress.admissionWebhooks.fullname" .) | quote }}
  {{- end }}
  {{- with $aw.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
    {{- with $aw.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "nginx-ingress.admissionWebhooks.fullname" . }}
webhooks:
  - name: validate.wxingress.wizardtales.com
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
    failurePolicy: {{ $aw.failurePolicy | default "Fail" }}
    sideEffects: None
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "nginx-ingress.admissionWebhooks.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        port: {{ $aw.service.servicePort }}
        path: /networking/v1/ingresses
    {{- if $aw.timeoutSeconds }}
    timeoutSeconds: {{ $aw.timeoutSeconds }}
    {{- end }}
    {{- with $aw.namespaceSelector }}
    namespaceSelector: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with $aw.objectSelector }}
    objectSelector: {{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
