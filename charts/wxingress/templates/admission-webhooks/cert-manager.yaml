{{- if and (dig "admissionWebhooks" "enabled" false .Values.controller) .Values.controller.admissionWebhooks.certManager.enabled -}}
{{- $cm := .Values.controller.admissionWebhooks.certManager -}}
{{- if not $cm.issuerRef -}}
# a self-signed Issuer for a root CA, which signs the webhook's certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "nginx-ingress.fullname" . }}-self-signed-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nginx-ingress.fullname" . }}-root-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
spec:
  secretName: {{ include "nginx-ingress.fullname" . }}-root-cert
  duration: {{ $cm.rootCert.duration | default "43800h0m0s" | quote }}
  {{- if gt ($cm.rootCert.revisionHistoryLimit | int) 0 }}
  revisionHistoryLimit: {{ $cm.rootCert.revisionHistoryLimit }}
  {{- end }}
  issuerRef:
    name: {{ include "nginx-ingress.fullname" . }}-self-signed-issuer
  commonName: "ca.webhook.wxingress"
  isCA: true
  subject:
    organizations:
      - wxingress
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "nginx-ingress.fullname" . }}-root-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "nginx-ingress.fullname" . }}-root-cert
{{- end }}
---
# the webhook's certificate, whose CA cert-manager's cainjector puts into the ValidatingWebhookConfiguration
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nginx-ingress.admissionWebhooks.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
spec:
  secretName: {{ include "nginx-ingress.admissionWebhooks.fullname" . }}
  duration: {{ $cm.admissionCert.duration | default "8760h0m0s" | quote }}
  {{- if gt ($cm.admissionCert.revisionHistoryLimit | int) 0 }}
  revisionHistoryLimit: {{ $cm.admissionCert.revisionHistoryLimit }}
  {{- end }}
  issuerRef:
    {{- if $cm.issuerRef }}
    {{- toYaml $cm.issuerRef | nindent 4 }}
    {{- else }}
    name: {{ include "nginx-ingress.fullname" . }}-root-issuer
    {{- end }}
  dnsNames:
    - {{ include "nginx-ingress.admissionWebhooks.serviceName" . }}
    - {{ include "nginx-ingress.admissionWebhooks.serviceName" . }}.{{ .Release.Namespace }}
    - {{ include "nginx-ingress.admissionWebhooks.serviceName" . }}.{{ .Release.Namespace }}.svc
  subject:
    organizations:
      - wxingress-admission
{{- end -}}
