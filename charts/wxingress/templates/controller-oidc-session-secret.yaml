{{- if and .Values.controller.enableOIDC (or .Values.controller.dynamicUpstreams .Values.controller.ingressNginxCompat) }}
{{- /* The key the wxingress module seals OIDC sessions with: one for all
       replicas, made once and kept across upgrades. */}}
{{- $name := printf "%s-oidc-session" (include "nginx-ingress.controller.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nginx-ingress.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ if and $existing $existing.data $existing.data.key }}{{ $existing.data.key }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
