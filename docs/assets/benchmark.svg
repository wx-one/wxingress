<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">wxingress compared with ingress-nginx</title>
<desc id="d">Same node, same backends, same 97 Ingresses. HTTP requests per second: ingress-nginx 39 156, rke2-ingress-nginx 62 145, wxingress 161 832. HTTPS requests per second: 30 960, 37 766, 63 629. CPU per HTTPS request: 141, 120, 63 microseconds. Memory under load: 246, 284, 135 MiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600;fill:#1d1d22} .s{font-size:12px;fill:#55555f}
.n{font-size:12.5px;fill:#55555f} .nw{font-size:12.5px;font-weight:700;fill:#1d1d22}
.v{font-size:12.5px;fill:#55555f} .vw{font-size:12.5px;font-weight:700;fill:#1d1d22}
.b{fill:#7d7d8a} .bw{fill:#6a3fb0} .ax{stroke:#d9d9de;stroke-width:1}
@media (prefers-color-scheme: dark){
.h,.nw,.vw{fill:#efeff2} .s,.n,.v{fill:#b9b9c3}
.b{fill:#6f6f7c} .bw{fill:#a687f0} .ax{stroke:#3a3a42}}
</style>
<g class="viz">
<text class="h" x="40" y="34">HTTP requests per second</text>
<text class="s" x="40" y="52">higher is better</text>
<line class="ax" x1="200" y1="64" x2="200" y2="164"/>
<text class="n" x="192" y="84.5" text-anchor="end">ingress-nginx 1.15.1</text>
