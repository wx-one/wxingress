<text class="v" x="247" y="84.5">39 156</text>
<text class="n" x="192" y="118.5" text-anchor="end">rke2-ingress-nginx 1.12.6</text>
<path class="b" d="M200,102 h61 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-61 z"/>
<text class="v" x="271" y="118.5">62 145</text>
<text class="nw" x="192" y="152.5" text-anchor="end">wxingress</text>
<path class="bw" d="M200,136 h166 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-166 z"/>
<text class="vw" x="376" y="152.5">161 832</text>
<text class="h" x="480" y="34">HTTPS requests per second</text>
<text class="s" x="480" y="52">higher is better</text>
<line class="ax" x1="640" y1="64" x2="640" y2="164"/>
<text class="n" x="632" y="84.5" text-anchor="end">ingress-nginx 1.15.1</text>
<path class="b" d="M640,68 h79 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-79 z"/>
<text class="v" x="729" y="84.5">30 960</text>
<text class="n" x="632" y="118.5" text-anchor="end">rke2-ingress-nginx 1.12.6</text>
<path class="b" d="M640,102 h97 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-97 z"/>
<text class="v" x="747" y="118.5">37 766</text>
<text class="nw" x="632" y="152.5" text-anchor="end">wxingress</text>
<path class="bw" d="M640,136 h166 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-166 z"/>
<text class="vw" x="816" y="152.5">63 629</text>
