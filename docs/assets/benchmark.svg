<text class="v" x="376" y="284.5">141 µs</text>
<text class="n" x="192" y="318.5" text-anchor="end">rke2-ingress-nginx 1.12.6</text>
<path class="b" d="M200,302 h141 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-141 z"/>
<text class="v" x="351" y="318.5">120 µs</text>
<text class="nw" x="192" y="352.5" text-anchor="end">wxingress</text>
