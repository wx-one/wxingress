<text class="v" x="793" y="284.5">246 MiB</text>
<text class="n" x="632" y="318.5" text-anchor="end">rke2-ingress-nginx 1.12.6</text>
<path class="b" d="M640,302 h166 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-166 z"/>
